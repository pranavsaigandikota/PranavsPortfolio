    <title>Pranavsai Gandikota | Software Engineer</title>
    <meta name="description" content="Software engineering work by Pranavsai Gandikota: Ford batch processing, UCF SASE, uKnight, Paradise, and applied AI research." />

  <body>
    <div id="root"></div>
    <script>
      // Keep existing bookmarks on the corresponding section of the single page.
      const sections = {about:'home',experience:'work',projects:'work',research:'work',skills:'skills',awards:'work',achievements:'work',hobbies:'contact',films:'contact',animations:'contact',flix:'home','case-studies':'work',toolkit:'skills',connect:'contact'};
      const savedRoute = new URLSearchParams(window.location.search).get('__portfolio_route');
      const oldRoute = savedRoute && /^\/(?:about|experience|projects|skills|research|hobbies|animations|films|awards|flix)\/?(?:[?#]|$)/.test(savedRoute) ? new URL(savedRoute, window.location.origin) : null;
      const path = (oldRoute ? oldRoute.pathname : window.location.pathname).replace(/^\/|\/$/g, '');
      if (sections[path]) {
        const search = oldRoute ? oldRoute.search : window.location.search;
        window.history.replaceState(null, '', '/' + search + '#' + sections[path]);
      } else if (window.location.pathname === '/' && sections[window.location.hash.slice(1)]) {
        window.history.replaceState(null, '', '/' + window.location.search + '#' + sections[window.location.hash.slice(1)]);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
