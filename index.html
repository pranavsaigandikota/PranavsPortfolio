<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23141414'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial, sans-serif' font-weight='900' font-size='50' fill='%23E50914'%3EPG%3C/text%3E%3C/svg%3E" />
    <link rel="canonical" href="https://pranavsaig.dev/" />
    <link rel="alternate" type="text/plain" href="/portfolio.txt" title="Readable portfolio text" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pranavsai Gandikota — Software Engineer &amp; Creative Technologist</title>
    <meta name="description" content="Pranavsai Gandikota — software engineer, AI builder, and creative technologist. Explore award-winning projects, Ford internship experience, research, and animation." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Bungee&family=Manrope:wght@400;500;600;700;800&family=Permanent+Marker&family=Space+Grotesk:wght@500;600;700&display=swap" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore known portfolio routes after GitHub Pages serves our 404 fallback.
      const portfolioRoute = new URLSearchParams(window.location.search).get('__portfolio_route');
      if (portfolioRoute && /^\/(?:about|experience|projects|skills|research|animations|films|awards|flix)\/?(?:[?#]|$)/.test(portfolioRoute)) {
        window.history.replaceState(null, '', portfolioRoute);
      }
      const portfolioSection = /^#(about|experience|projects|skills|research|animations|films|awards|achievements)$/.exec(window.location.hash);
      if (!portfolioRoute && window.location.pathname === '/' && portfolioSection) {
        window.history.replaceState(null, '', '/' + (portfolioSection[1] === 'achievements' ? 'awards' : portfolioSection[1] === 'films' ? 'animations' : portfolioSection[1]));
      }
      if (/^\/films\/?$/.test(window.location.pathname)) {
        window.history.replaceState(null, '', '/animations' + window.location.search + window.location.hash);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
